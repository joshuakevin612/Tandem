# Front door for the API replicas. Docker's DNS (127.0.0.11) returns every
# replica of `api`; `resolve` re-queries it so restarted replicas are picked up.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream taskq_api {
    zone taskq_api 64k;
    server api:8080 resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://taskq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Authorization, X-API-Key, X-Tenant-ID and X-Request-ID are forwarded by default.

        # Retry another replica only on connect errors/timeouts. POST is never
        # retried (non_idempotent is deliberately NOT set): a retried submit could duplicate a job.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
