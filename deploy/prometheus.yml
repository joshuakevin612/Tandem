# Scrapes every replica via Docker DNS (a service name resolves to all of its
# containers), so scaling `--scale worker=N` needs no config change.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api # direct to the replicas; nginx (correctly) 404s /metrics
    dns_sd_configs:
      - names: [api]
        refresh_interval: 10s
        type: A
        port: 8080
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        refresh_interval: 10s
        type: A
        port: 9090
  - job_name: scheduler
    dns_sd_configs:
      - names: [scheduler]
        refresh_interval: 10s
        type: A
        port: 9090
