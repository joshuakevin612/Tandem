name: taskq

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &env
    DATABASE_URL: postgres://taskq:taskq@postgres:5432/taskq?sslmode=disable
    REDIS_URL: redis://redis:6379/0
  depends_on: &deps
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq
      POSTGRES_DB: taskq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq -d taskq"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *env
      AUTH_MODE: apikey # the chaos override switches this back to header
    deploy:
      replicas: 2
    healthcheck:
      # distroless image: no shell or curl, so the binary probes itself.
      test: ["CMD", "api", "-healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      <<: *deps
      api:
        condition: service_healthy
    deploy:
      replicas: 3

  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on:
      <<: *deps
      api:
        condition: service_healthy
    deploy:
      replicas: 2

  # Observability. DEV ONLY: Grafana allows anonymous (Viewer) access and the
  # Prometheus API is unauthenticated. Do not expose these ports as-is.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # dev only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskq.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
