<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c0407">
  <title>tandem console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/console.css">
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="backdrop__blob"></i><i class="backdrop__blob"></i><i class="backdrop__blob"></i><i class="backdrop__stars"></i></div>
  <header class="bar">
    <div class="bar__inner">
      <a class="wordmark" href="#/home" aria-label="tandem home">
        <img class="wordmark__mark" src="assets/mark.svg" alt="" width="30" height="30">
        <span class="wordmark__text">tandem</span>
      </a>
      <nav class="nav" aria-label="Sections" hidden>
        <span class="nav__pill" aria-hidden="true"></span>
        <a class="nav__link" href="#/jobs" data-route="jobs">Jobs</a>
        <a class="nav__link" href="#/schedules" data-route="schedules">Schedules</a>
      </nav>
      <div class="bar__right" hidden>
        <button class="live" type="button" aria-label="Pause or resume live updates">
          <span class="live__dot" aria-hidden="true"></span>
          <span class="live__text">Live</span>
        </button>
        <button class="account" type="button" aria-label="Connection">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="8.2"/><circle cx="10" cy="8" r="2.8"/><path d="M4.6 15.6c1.3-2 3.1-3 5.4-3s4.1 1 5.4 3" stroke-linecap="round"/></svg>
        </button>
        <button class="btn btn--pop" type="button" data-action="new" aria-label="New job">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          <span class="btn__label" data-new-label>New job</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1"></main>

  <div class="scrim" aria-hidden="true"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true" data-native-scroll></aside>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true" data-native-scroll></section>
  <div class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
